<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Onelly Edit</title>
<style>
:root{
  box-sizing:border-box;
  --bg:#EDEBF7;--panel:#fff;--panel2:#F3F1FA;--text:#14121F;--muted:#6B6885;--line:#D8D4EA;--violet:#7A3CFF;--magenta:#FF3D9A;--lime:#C8FF3D;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A14;--panel:#15152A;--panel2:#0F0F1E;--text:#F4F3FA;--muted:#8C8BA8;--line:#26264A}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;
  font:14px/1.3 system-ui,-apple-system,"Noto Sans","Noto Sans Ethiopic","Noto Sans Arabic",sans-serif}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.bar{display:flex;align-items:center;gap:8px;padding:6px 10px;height:48px}
.bar .name{flex:1;font-weight:600}.brand{background:linear-gradient(135deg,var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px;font:inherit}
.exp{background:var(--lime);color:#1a2300;font-weight:700;border-radius:8px;padding:7px 14px}
#stage{flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;position:relative;padding-bottom:52px;box-sizing:border-box}
#frame{position:relative;overflow:hidden;background:#000;touch-action:none}
#v{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);object-fit:contain}
#ov{position:absolute;inset:0;pointer-events:none}
#ov div{position:absolute;transform:translate(-50%,-50%);text-align:center;font-weight:700;max-width:92%;text-shadow:0 1px 3px #000}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
.big{background:linear-gradient(135deg,var(--violet),var(--magenta));color:#fff;border-radius:12px;padding:12px 20px;font-weight:700;display:flex;gap:8px;align-items:center}
#ctrl{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel2)}
#ctrl .t{flex:1;color:var(--muted);font-variant-numeric:tabular-nums}
#ctrl button{padding:6px}#ctrl button:disabled{opacity:.3}
#play{width:40px;height:40px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center}
#tlwrap{position:relative;height:212px;background:var(--panel2);border-top:1px solid var(--line)}
#tls{height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}#tls::-webkit-scrollbar{display:none}
#trk{position:relative;height:100%;min-width:100%}

#row{position:absolute;top:26px;height:58px;display:flex;gap:2px}
.clip{position:relative;height:58px;border-radius:8px;overflow:hidden;background:#222;flex:0 0 auto;border:2px solid transparent;cursor:pointer;display:flex}
.clip.sel{border-color:#fff}
.clip i{flex:1 0 auto;background-size:cover;background-position:center}
.clip em{position:absolute;left:4px;bottom:2px;font-size:10px;font-style:normal;background:#0009;border-radius:4px;padding:0 4px}
.add{flex:0 0 58px;height:58px;border-radius:8px;background:var(--panel);border:1px dashed var(--muted);display:flex;align-items:center;justify-content:center;color:var(--muted)}
#trow{position:absolute;top:92px;height:26px}
.tp{position:absolute;height:24px;border-radius:6px;background:var(--violet);font-size:11px;padding:3px 6px;overflow:hidden;white-space:nowrap}
#orow{position:absolute;top:122px;height:24px}
.op{position:absolute;height:24px;border-radius:6px;background:var(--magenta);color:#fff;font-size:12px;padding:3px 6px;overflow:hidden;white-space:nowrap;cursor:pointer}.op.sel{outline:2px solid #fff}
#ovl{position:absolute;inset:0;pointer-events:none}
.ovi{position:absolute;touch-action:none;pointer-events:auto;user-select:none;cursor:move;line-height:1}.ovi.sel{outline:2px dashed var(--lime)}
.hd{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;color:#000;display:none;align-items:center;justify-content:center;font-size:14px;font-style:normal;z-index:2}
.ovi.sel .hd{display:flex}.ovi.sel{box-shadow:0 0 0 2px var(--lime)}
.op{touch-action:none}.op u{position:absolute;top:0;bottom:0;width:12px;background:#fff7;text-decoration:none}.op u.l{left:0;border-radius:6px 0 0 6px}.op u.r{right:0;border-radius:0 6px 6px 0}.op span{pointer-events:none;padding:0 10px}
.gd{position:absolute;background:var(--lime);display:none;z-index:4;pointer-events:none}#gx{left:50%;top:0;bottom:0;width:1px}#gy{top:50%;left:0;right:0;height:1px}
#tools button:active{background:var(--violet);color:#fff;transform:scale(.93)}#tools button.on{background:var(--violet);color:#fff}
@keyframes fl{0%{background:var(--lime);color:#000}100%{background:transparent}}#tools button.flash{animation:fl .45s}
#tools button.rec{background:#c0182a;color:#fff;animation:pl 1s infinite}@keyframes pl{50%{opacity:.55}}
#arow{position:absolute;top:152px;height:24px}.op.ap{background:#1fa971}
.emo button:active,.chip:active{background:var(--violet);color:#fff}
.th{position:absolute;top:0;bottom:0;width:16px;background:#fff;opacity:.92;display:none;touch-action:none;z-index:2;text-decoration:none}
.clip.sel .th{display:block}.th.l{left:0;border-radius:6px 0 0 6px}.th.r{right:0;border-radius:0 6px 6px 0}.reorder .th{display:none!important}
label.s b{width:46px;text-align:end;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.reorder .clip{touch-action:none}.clip.drag{opacity:.75;z-index:6;border-color:var(--lime)}.clip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.add.addl{position:absolute;left:-62px;top:0}
.ovi video,.ovi img{width:100%;display:block;border-radius:6px;pointer-events:none}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.emo button{font-size:26px;padding:4px;border-radius:8px;background:var(--panel2)}
@keyframes pr{0%{box-shadow:0 0 0 0 #C8FF3Dcc}100%{box-shadow:0 0 0 12px #C8FF3D00}}
.clip:active{border-color:var(--lime);filter:brightness(1.3)}.clip.pulse{animation:pr .45s}
.th:active{background:var(--lime)}.add:active{background:var(--violet);color:#fff}
#tbadge{position:absolute;top:3px;left:50%;transform:translateX(-50%);background:var(--lime);color:#1a2300;font-weight:700;font-size:12px;padding:2px 9px;border-radius:10px;z-index:4;display:none;pointer-events:none}
#vig,#grn{position:absolute;inset:0;pointer-events:none;display:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,#000 135%)}#grn{mix-blend-mode:overlay;background-size:96px}
.clip.hastr::before{content:"◆";position:absolute;left:3px;top:1px;color:var(--lime);font-size:11px;z-index:3;text-shadow:0 0 3px #000}
#est{color:var(--muted);margin:6px 0 10px;font-variant-numeric:tabular-nums;font-weight:600}
#xo{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#2a1566 0%,#0A0A14 70%);color:#fff;text-align:center}
#xo[hidden]{display:none}#xoc{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.xbox{position:relative;width:min(92%,420px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
.xprev{border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px #ffffff22,0 10px 40px #7A3CFF88;max-height:30vh;display:flex}
#xpv{max-height:30vh;max-width:100%;display:block;background:#000}
.xring{position:relative;width:176px;height:176px;animation:xp 2.2s ease-in-out infinite;filter:drop-shadow(0 0 14px #7A3CFFaa)}
#xo.done .xring{animation:none;filter:drop-shadow(0 0 18px #C8FF3Dbb)}
.xring svg{width:100%;height:100%}.xbg{fill:none;stroke:#ffffff22;stroke-width:8}
.xfg{fill:none;stroke:url(#xg);stroke-width:8;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset .2s linear}
.xnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px}
#xpct{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#fff,#C8FF3D);-webkit-background-clip:text;background-clip:text;color:transparent}
.xnum small{font-size:18px;color:#ffffffaa;margin-top:14px}#xo.done .xnum small{display:none}#xo.done #xpct{font-size:64px}
@keyframes xp{50%{transform:scale(1.04)}}
#xst{font-size:17px;font-weight:700;min-height:24px}.xbar{width:100%;height:6px;background:#ffffff22;border-radius:4px;overflow:hidden}
.xbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7A3CFF,#FF3D9A,#C8FF3D);transition:width .2s linear}
#xeta,#xinfo{color:#ffffffbb;font-size:13px;font-variant-numeric:tabular-nums;min-height:17px}
#xact{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.xb{background:#2c2160;color:#fff;border-radius:22px;padding:11px 20px;font-weight:600;text-decoration:none;border:1px solid #ffffff33}
.xb.main{background:var(--lime);color:#1a2300;border:0}
#xbat{color:#ffffffcc;font-size:13px;min-height:17px}#xtip{color:#C8FF3D;font-size:12.5px;min-height:34px;max-width:320px}#mdesc{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
#xo.play .xprev,#xo.play #xpv{max-height:none}#xo.play .xring{width:132px;height:132px}#xo.play #xpct{font-size:40px}#xo.play .xnum small{font-size:14px;margin-top:8px}
.fls i{position:absolute;bottom:-40px;font-style:normal;font-size:22px;opacity:.22;animation:xfloat 10s linear infinite;pointer-events:none}
.fls i:nth-child(1){left:6%;animation-delay:0s}.fls i:nth-child(2){left:18%;animation-delay:2s}.fls i:nth-child(3){left:31%;animation-delay:5s}.fls i:nth-child(4){left:44%;animation-delay:1s}
.fls i:nth-child(5){left:58%;animation-delay:6s}.fls i:nth-child(6){left:71%;animation-delay:3s}.fls i:nth-child(7){left:84%;animation-delay:7s}.fls i:nth-child(8){left:93%;animation-delay:4s}
@keyframes xfloat{to{transform:translateY(-115vh) rotate(40deg)}}#xo.calm .fls,#xo.done .fls{display:none}
#xmile{min-height:22px;font-weight:700;color:#C8FF3D}#xmile.mp{animation:mp .6s ease-out}@keyframes mp{0%{transform:scale(.6);opacity:0}35%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
.xb.sm{padding:7px 14px;font-size:13px}
#xgame{display:none;position:relative;width:100%;height:124px;overflow:hidden;border-radius:14px;background:#ffffff0d;border:1px dashed #ffffff33;touch-action:manipulation}
#xscore{position:absolute;top:5px;left:9px;font-size:12px;opacity:.9;z-index:2;pointer-events:none}
.bub{position:absolute;bottom:-30px;font-size:30px;line-height:1;animation:rise linear forwards;cursor:pointer;user-select:none;touch-action:manipulation}
@keyframes rise{to{transform:translateY(calc(-1 * var(--gh,150px)))}}.bub.pop{animation:none;transform:scale(1.9);opacity:0;transition:.18s}
#xo{align-items:flex-start;overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 4px);-webkit-overflow-scrolling:touch}
.xbox{gap:7px;padding:6px 16px calc(24px + env(safe-area-inset-bottom,0px));margin:0 auto}
.xprev{position:relative;height:clamp(140px,28vh,320px);max-height:none;padding:3px;border-radius:19px;overflow:hidden;background:linear-gradient(135deg,#7A3CFF,#FF3D9A,#C8FF3D);box-shadow:0 12px 44px #7A3CFF99,0 0 0 1px #ffffff22}
#xpv{height:100%;width:auto;max-width:100%;max-height:none;border-radius:16px;display:block;background:#000}
.xprev::before{content:"● LIVE";position:absolute;top:10px;left:11px;z-index:2;font-size:10px;font-weight:800;letter-spacing:.5px;background:#000b;color:#fff;border-radius:8px;padding:2px 7px;animation:pl 1.2s infinite}#xo.done .xprev::before{display:none}.xring{width:148px;height:148px}#xpct{font-size:46px}.xnum small{font-size:15px;margin-top:10px}
#xo.play .xprev{height:clamp(120px,26vh,280px)}#xo.play .xring{width:112px;height:112px}#xo.play #xpct{font-size:34px}#xo.play .xnum small{font-size:12px;margin-top:6px}
#xst{font-size:16px;min-height:20px}#xmile{min-height:18px;font-size:14px}
.xmeta{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px;font-size:12.5px;color:#ffffffbb;font-variant-numeric:tabular-nums}
.xmeta span{min-height:0}#xact{margin-top:2px}#xtip{min-height:0;font-size:12px}
#xgame{height:104px;flex:none;min-height:0}
#xo{align-items:stretch}
#kfbar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:6px;max-width:98%;overflow-x:auto;scrollbar-width:none}#kfbar button{flex:none}#kfbar[hidden]{display:none}
#kfbar button{background:#1c1c2a;color:var(--lime);border:1px solid #ffffff22;border-radius:16px;padding:7px 13px;font-weight:700}#kfbar #kfdel{background:#d6204a;color:#fff;border-color:#d6204a}#kfbar button[hidden]{display:none}
.kfm{position:absolute;top:-1px;font-size:10px;color:#fff;margin-left:-4px;pointer-events:none;z-index:2}
.ovi canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:none;pointer-events:none}.ovi.ckon canvas{display:block}.ovi.ckon video,.ovi.ckon img{visibility:hidden}
.bt{position:absolute;top:2px;bottom:2px;width:2px;background:#ffffffbb;pointer-events:none;z-index:1}
.op u{width:22px}.op u::after,.th::after{content:"";position:absolute;top:28%;bottom:28%;left:50%;width:2px;margin-left:-1px;background:#00000077}
.th{width:24px}.op span{padding:0 14px}
#snapl{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--lime);display:none;z-index:5;pointer-events:none;box-shadow:0 0 8px var(--lime)}
#dtip{position:fixed;z-index:60;display:none;transform:translateX(-50%);background:var(--lime);color:#1a2300;font-weight:800;font-size:13px;padding:5px 11px;border-radius:13px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px #0008}
.op u{display:none;width:20px;background:#fff;opacity:1;border-radius:8px}.op.sel u{display:block}.op u.l{left:-5px}.op u.r{right:-5px}.op u::after{background:#00000088}
.op.sel{outline:2px solid #fff;z-index:2;overflow:visible}
.clip.sel .th{background:#fff;border-radius:8px}.th.l{left:-3px}.th.r{right:-3px}
#ph{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;z-index:3;pointer-events:none}
#ph::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:#fff}
#tools{display:flex;gap:2px;overflow-x:auto;padding:6px 6px 8px;background:var(--bg);scrollbar-width:none;border-top:1px solid var(--line)}
#tools::-webkit-scrollbar{display:none}
#tools button{flex:0 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 4px;border-radius:8px;color:var(--text)}
#tools button:disabled{opacity:.3}
#panel{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:5;max-height:42%;overflow:auto}
#panel[hidden]{display:none}
.ph{display:flex;align-items:center;margin-bottom:8px;gap:4px}.ph b{flex:1;margin:0 4px}.ph button{padding:6px 10px;border-radius:14px;background:var(--panel2)}html[dir=rtl] #pback svg{transform:scaleX(-1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}#tmv,#amv,#twd{flex-wrap:wrap;overflow-x:visible}body.pnl #qBtn,body:has(#panel:not([hidden])) #qBtn{display:none!important}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:18px;background:var(--panel2);border:1px solid var(--line)}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.tile{flex:0 0 auto;width:70px;text-align:center;font-size:11px}
.tile div{width:70px;height:70px;border-radius:10px;background-size:cover;background-position:center;background-color:#333;border:2px solid transparent;margin-bottom:4px}
.tile.on div{border-color:var(--lime)}
label.s{display:flex;gap:10px;align-items:center;margin:8px 0;color:var(--muted)}label.s span{width:86px}label.s input{flex:1}
input[type=text]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}
.dots{display:flex;gap:10px;margin:8px 0}.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}.dot.on{border-color:var(--lime)}
#msg{position:absolute;left:10px;right:10px;top:8px;background:#000c;color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;z-index:4}
#msg:empty{display:none}#msg a{color:var(--lime)}
.wf{position:absolute;left:0;bottom:0;width:100%!important;height:45%!important;pointer-events:none;z-index:1}.wf path{stroke:#C8FF3D;stroke-width:1.6;vector-effect:non-scaling-stroke;opacity:.9}

#mzc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;pointer-events:none;display:none}
.mkf{position:absolute;top:-8px;bottom:-4px;width:3px;margin-left:-1px;background:#FFC94D;border-radius:2px;pointer-events:none;z-index:4}.mkf::before{content:'';position:absolute;top:0;left:3px;border:6px solid transparent;border-left-color:#FFC94D;border-right:0}
#bgc{position:absolute;left:0;top:0;width:100%;height:100%;display:none;transform:scale(1.25);pointer-events:none}
#lutc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:none}

</head>
<body>
<div id="app">
  <div class="bar">
    <span class="name"><span class="brand">Onelly Edit</span></span>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="am">አማርኛ</option><option value="om">Oromoo</option><option value="ar">العربية</option></select>
    <button class="exp" id="exp"></button>
  </div>
  <div id="stage">
    <div id="frame"><canvas id="bgc"></canvas><video id="v" playsinline></video><canvas id="lutc"></canvas><canvas id="mzc"></canvas><div id="vig"></div><div id="grn"></div><div id="ovl"></div><div id="ov"></div><div class="gd" id="gx"></div><div class="gd" id="gy"></div></div><input id="audfile" type="file" accept="audio/*" hidden><input id="vfile" type="file" accept="audio/*" capture hidden><input id="ovfile" type="file" accept="image/*,video/*" hidden>
    <div id="empty"><div id="hint"></div><label class="big"><input id="file" type="file" accept="video/*,.mp4,.m4v,.mov,.3gp,.3g2,.mkv,.webm,.avi,.ts,.mts,.m2ts,.wmv,.flv,.mpg,.mpeg,.ogv" multiple hidden><span id="tImp"></span></label></div>
    <div id="kfbar" hidden><button id="kfadd">◆ <span id="kfl"></span></button><button id="kfkey" hidden>🟩</button><button id="kfbm" aria-label="Blend">◐</button><button id="kfan" aria-label="Animate">✦</button><button id="kfts" hidden>Aa</button><button id="kfclr" aria-label="Clear keyframes">◆✕</button><button id="kfvol" aria-label="Volume">🔊</button><button id="kfsp" aria-label="Split">✂</button><button id="kfdup" aria-label="Duplicate">⧉</button><button id="kfdel" aria-label="Delete">🗑</button></div><div id="msg"></div>
  </div>
  <div id="ctrl">
    <span class="t" id="time">00:00 / 00:00</span>
    <button id="undo" aria-label="Undo"></button><button id="play" aria-label="Play"></button><button id="redo" aria-label="Redo"></button>
    <span class="t" style="text-align:end" id="ratioLbl"></span>
  </div>
  <div id="tlwrap"><div id="tbadge"></div><div id="tls"><div id="trk"><div id="snapl"></div><div id="row"></div><div id="orow"></div><div id="arow"></div></div></div><div id="ph"></div></div>
  <div id="tools"></div>
